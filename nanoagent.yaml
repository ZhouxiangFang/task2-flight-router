_ > nanoagent.plugin.v0001.ManifestConfig:
id: flight-router
name: Flight Router
version: 0.3.0
status: ready
spec: nanoagent.plugin/v0001

runtime > nanoagent.plugin.v0001.RuntimeConfig:
  type: mcp_stdio
  command: [uv, run, --frozen, python, -m, plugin]

permissions > nanoagent.plugin.v0001.PermissionsConfig:
  network > nanoagent.plugin.v0001.NetworkConfig:
    hosts: []
  filesystem > nanoagent.plugin.v0001.FilesystemConfig:
    write: [workspace]

# One entry per contract.Tool; its input and output classes are contract.TOOLS's.
tools > dict[contract.Tool, nanoagent.plugin.v0001.ToolConfig]:
  find_airports:
    description: |-
      Look up airports for the task's origin or destination, passed unchanged.
      Three uppercase letters mean an IATA code; otherwise match a city, ignoring case and accents.
      City names cover all matching countries; "City, Country" restricts the country unless the full text is itself a city name.
      Returns {"place", "kind", "airports": [{"code", "city", "country", "flights_out", "flights_in"}, ...]}, sorted by code.
      flights_out and flights_in count outgoing and incoming neighboring airports. Unknown places raise "no such airport" or "no such city".
  next_airports:
    description: |-
      Find airports one flight away from a list of unique IATA codes. Use forward for outgoing flights or backward for incoming flights.
      Returns {"reached": [{"airport", "via"}, ...]}, sorted by airport, without duplicates or input airports.
      Forward means via flies to airport; backward means airport flies to via. Results may include previously visited airports.
      An empty list means no neighbors in that direction. Unknown codes raise errors.

# One entry per contract.Task; its input class is contract.TASKS's.
tasks > dict[contract.Task, nanoagent.plugin.v0001.TaskConfig]:
  plan-flight-route:
    description: Find connecting flights between two airports or cities, or explain why no route exists.
    runner: agent
    tools: [find_airports, next_airports]
    reference: null
    instructions: |-
      Submit {"status": ..., "airports": [...]}. For found, list IATA codes from origin to destination with no repeats. Any valid route is accepted; it need not be shortest. Other statuses require an empty list. Parallelize independent calls; turns are limited.
      1. Call find_airports for both places. Check origin errors before destination errors and submit no_such_airport or no_such_city as reported. If the airport sets overlap, submit same_place. If all origins have flights_out 0 or all destinations have flights_in 0, submit no_flight.
      2. Search from both ends. Initialize forward map F and frontier with all origin airports, and backward map B and frontier with all destination airports. Starting airports have no parent.
      3. If both frontiers have at most 10 airports, expand both with next_airports in parallel; otherwise expand only the smaller frontier. Use forward for F and backward for B. Record each newly reached airport and its via in that side's map; only new airports form its next frontier.
      4. When an airport X appears in both maps, trace F's parents from X to an origin and B's parents from X to a destination. Reverse the first chain and join them with X once. Submit found.
      5. If an expanded frontier produces no new airport before the maps meet, submit no_route.
