_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Find connecting flights between airports or cities"
summary: "Enter an origin and destination, such as Houston and London. The agent searches a fixed OpenFlights dataset and returns a route, or explains why none exists. Every flight is checked against the data."
highlights:
  - "Use airport codes, city names, or a city and country"
  - "Accepts any valid route without repeated airports"
  - "Searches 6,071 airports and 37,041 directed connections"
  - "Uses historical routes, without schedules or prices"
steps:
  - "Ask: Find a route from Houston to London"
  - "The agent looks up airports and searches their connections"
  - "View the route and its verification verdict"
