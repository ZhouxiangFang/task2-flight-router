_ > nanoagent.plugin.v0001.ProductConfig:
tagline: "Find a route of nonstop flights between two airports or cities"
summary: "Input: an origin and a destination, each an airport code such as HOU or a city such as Houston or Portland, United States. What the agent does: it looks both places up with find_airports, then searches the nonstop flights of a frozen OpenFlights snapshot from both ends with next_airports, one breadth-first step at a time. Output: a status and the route's airports in flying order. The status is found, with a route of as many flights as it takes, such as HOU, ATL, LHR for Houston to London; or else no_such_airport, no_such_city, same_place, no_flight or no_route, each with an empty route. A deterministic verifier checks every flight against the data."
highlights:
  - "Any route of real nonstop flights passes, however many flights and not only the shortest"
  - "Airport codes or city names, with case, accents and a country to tell cities apart"
  - "Every way a trip can fail has its own status: a code or city that does not exist, the same place twice, an airport with no flights, or no route at all"
  - "No model and no network in the verifier: 6,071 airports and 37,041 flights, pinned by SHA-256"
steps:
  - "Ask for a route by code or city, such as \"Find flights from Houston to London\""
  - "The agent looks up both places with find_airports"
  - "It searches from both ends with next_airports until the two searches meet or one runs out"
  - "It returns the route's airports or says why there is none, and the verifier judges every flight"
